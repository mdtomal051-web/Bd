
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BD Virul Videos - Telegram Mini App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            blue: '#38bdf8',
                            glow: 'rgba(56, 189, 248, 0.4)',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Dark Glassmorphism */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* Neon Glowing Buttons */
        .glow-button {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
            transition: all 0.3s ease;
        }
        .glow-button:active {
            transform: scale(0.97);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .glow-unlock {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.45);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.7); }
        }

        /* Background Light Orbs */
        .bg-orb-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        .bg-orb-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen pb-20 selection:bg-neon-blue selection:text-slate-900">

    <!-- Ambient Glow Backgrounds -->
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 px-4 py-3.5">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-neon-blue flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-play text-slate-950 text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-white flex items-center gap-1.5">
                        BD Virul Videos
                        <span class="text-[10px] bg-sky-500/20 text-neon-blue px-2 py-0.5 rounded-full border border-sky-500/30 font-semibold">MINI APP</span>
                    </h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="tg-user-id">Auto Authenticated</span>
                    </p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Informational Banner -->
        <div class="mb-5 glass-card p-4 rounded-2xl flex items-center gap-3 border-l-4 border-l-neon-blue">
            <div class="w-9 h-9 rounded-full bg-sky-500/10 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-bolt text-neon-blue"></i>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
                Complete short video ads to gain instant access to exclusive premium download & stream links!
            </p>
        </div>

        <!-- Task List Header -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-fire text-amber-400"></i> Available Exclusive Links
            </h2>
            <span id="task-counter-badge" class="text-xs font-bold text-slate-400 bg-slate-800/80 px-2.5 py-0.5 rounded-full border border-slate-700">0 Available</span>
        </div>

        <!-- Dynamic Tasks Container -->
        <div id="tasks-list" class="space-y-4">
            <!-- Skeleton Loading State -->
            <div class="glass-card p-4 rounded-2xl animate-pulse space-y-3">
                <div class="h-44 bg-slate-800 rounded-xl"></div>
                <div class="h-4 bg-slate-800 rounded w-3/4"></div>
                <div class="h-3 bg-slate-800 rounded w-1/2"></div>
            </div>
        </div>

    </main>

    <!-- Floating Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 opacity-0 translate-y-10 pointer-events-none">
        <div class="glass-card px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-white/10">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-msg" class="text-xs font-semibold text-white">Action Completed</span>
        </div>
    </div>

    <!-- Firebase JS SDK (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCT7usZ8A0rRv9NAW83HpAKp_pXbRFw9ng",
            authDomain: "bd-virul-video.firebaseapp.com",
            databaseURL: "https://bd-virul-video-default-rtdb.firebaseio.com",
            projectId: "bd-virul-video",
            storageBucket: "bd-virul-video.firebasestorage.app",
            messagingSenderId: "61185036021",
            appId: "1:61185036021:web:8bbc1aeb623138e3133fbc"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Adsgram Block ID
        const ADSGRAM_BLOCK_ID = "int-56343";

        // Global State
        let currentUserId = null;
        let tasksData = {};
        let userProgressData = {};

        // Auto Authenticaton & Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            // Telegram WebApp Initialization
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    currentUserId = window.Telegram.WebApp.initDataUnsafe.user.id.toString();
                }
            }

            // Fallback to Firebase Anonymous Auth if Telegram user ID is missing
            if (!currentUserId) {
                try {
                    const cred = await auth.signInAnonymously();
                    currentUserId = cred.user.uid;
                } catch (e) {
                    currentUserId = "guest_" + Math.random().toString(36).substring(2, 9);
                }
            }

            document.getElementById('tg-user-id').innerText = `ID: ${currentUserId.substring(0, 10)}`;

            // Realtime Listeners
            listenUserProgress();
            listenTasks();
        });

        // Listen for User Tasks Progress
        function listenUserProgress() {
            db.ref(`users/${currentUserId}/tasks`).on('value', snapshot => {
                userProgressData = snapshot.val() || {};
                renderTasks();
            });
        }

        // Listen for Tasks List
        function listenTasks() {
            db.ref('tasks').on('value', snapshot => {
                tasksData = snapshot.val() || {};
                renderTasks();
            });
        }

        // Render Tasks to UI
        function renderTasks() {
            const container = document.getElementById('tasks-list');
            const keys = Object.keys(tasksData);
            document.getElementById('task-counter-badge').innerText = `${keys.length} Available`;

            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 rounded-2xl text-center space-y-3">
                        <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mx-auto text-slate-500 text-xl">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <p class="text-sm text-slate-400 font-medium">No tasks available right now. Please check back later!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            keys.reverse().forEach(taskId => {
                const task = tasksData[taskId];
                
                // Skip disabled tasks
                if (task.active === false) return;

                const watchedCount = userProgressData[taskId] || 0;
                const targetCount = parseInt(task.targetAds || 3);
                const isUnlocked = watchedCount >= targetCount;
                const progressPercent = Math.min(100, Math.round((watchedCount / targetCount) * 100));

                const taskCard = `
                    <div class="glass-card rounded-2xl overflow-hidden border border-slate-700/50 transition-all duration-300">
                        <div class="relative h-44 w-full bg-slate-900 overflow-hidden">
                            <img src="${escapeHtml(task.image)}" 
                                 alt="${escapeHtml(task.title)}" 
                                 class="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                                 onerror="this.src='https://placehold.co/600x400/0f172a/38bdf8?text=Premium+Video'">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                            
                            <span class="absolute top-3 right-3 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase backdrop-blur-md ${isUnlocked ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-sky-500/20 text-neon-blue border border-sky-500/30'}">
                                ${isUnlocked ? '<i class="fa-solid fa-lock-open mr-1"></i> Unlocked' : `<i class="fa-solid fa-lock mr-1"></i> ${targetCount - watchedCount} Ads Left`}
                            </span>
                        </div>

                        <div class="p-4 space-y-3">
                            <div>
                                <h3 class="font-bold text-base text-white tracking-tight leading-snug">${escapeHtml(task.title)}</h3>
                                <p class="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">${escapeHtml(task.desc || '')}</p>
                            </div>

                            <!-- Progress Bar -->
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-slate-400 font-medium">Ad Progress</span>
                                    <span class="font-mono text-neon-blue font-bold">${watchedCount} / ${targetCount} Ads Watched</span>
                                </div>
                                <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                    <div class="h-full bg-gradient-to-r from-sky-500 to-neon-blue rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            ${isUnlocked ? `
                                <div class="space-y-2 pt-1">
                                    <a href="${task.secretUrl}" target="_blank" class="w-full glow-unlock py-3 rounded-xl font-bold text-slate-950 text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-unlock text-sm"></i> Unlock Link Now
                                    </a>
                                </div>
                            ` : `
                                <button onclick="triggerAdsgram('${taskId}', ${targetCount})" class="w-full glow-button py-3 rounded-xl font-bold text-slate-950 text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-play text-xs"></i> Watch Ad to Unlock (${watchedCount}/${targetCount})
                                </button>
                            `}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', taskCard);
            });
        }

        // Trigger Adsgram Interstitial Ad
        function triggerAdsgram(taskId, targetAds) {
            if (typeof window.Adsgram === 'undefined') {
                showToast("Adsgram SDK unavailable or blocked.", "error");
                // Test Fallback for non-telegram environments
                if (confirm("Adsgram SDK is blocked or unavailable in this view. Simulate watching an ad?")) {
                    incrementUserAdProgress(taskId, targetAds);
                }
                return;
            }

            showToast("Loading Ad...", "info");

            const AdController = window.Adsgram.init({ 
                blockId: ADSGRAM_BLOCK_ID 
            });

            AdController.show().then((result) => {
                showToast("Ad watched successfully!", "success");
                incrementUserAdProgress(taskId, targetAds);
            }).catch((result) => {
                console.warn("Adsgram status:", result);
                showToast("You must complete the ad to unlock.", "error");
            });
        }

        // Update User Ad Watch Count in Firebase
        function incrementUserAdProgress(taskId, targetAds) {
            if (!currentUserId) return;

            const currentVal = userProgressData[taskId] || 0;
            const newVal = currentVal + 1;

            db.ref(`users/${currentUserId}/tasks/${taskId}`).set(newVal)
                .then(() => {
                    if (newVal >= targetAds) {
                        showToast("🎉 Link Unlocked Successfully!", "success");
                    } else {
                        showToast(`Progress: ${newVal}/${targetAds} Ads`, "info");
                    }
                })
                .catch(err => {
                    console.error("Firebase update failed:", err);
                    showToast("Failed to save progress", "error");
                });
        }

        // Toast Notification Helper
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-400";
            } else if (type === "info") {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
            }, 3000);
        }

        // Helper to Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
